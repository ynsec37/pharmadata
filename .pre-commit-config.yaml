# Pre-commit hooks: the same checks CI runs, locally, on staged files.
# Install once with:  uv run pre-commit install   (pre-commit is a dev extra)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated Quarto freeze cache: binary-ish, no trailing newline by design.
      - id: trailing-whitespace
        exclude: ^docs/_freeze/
      - id: end-of-file-fixer
        exclude: ^docs/_freeze/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^docs/_freeze/
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^(src|data-raw)/
        additional_dependencies: [pandas-stubs]

  # The project's own pinned tools, run over the whole tree so the result matches CI.
  - repo: local
    hooks:
      # A whole-tree scan takes a tenth of a second, so no per-file run.
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false

      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        files: ^(src|data-raw)/
        pass_filenames: false
