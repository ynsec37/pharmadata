version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]

  # uv projects record the resolution in uv.lock; the pip ecosystem drives it.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies"]
    allow:
      - dependency-type: "all"
