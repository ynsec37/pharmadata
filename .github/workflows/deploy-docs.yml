name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ runner.temp }}/rlib
      RENV_PATHS_LIBRARY: ${{ runner.temp }}/rlib
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group docs

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - run: uv run python data-raw/03_build_data.py
      - run: uv run python data-raw/05_build_dataset_qmd.py

      # The WASM notebook installs the package from a wheel served alongside the
      # page. The wheel is gitignored, so build it here before great-docs copies
      # docs/notebooks/ into the site.
      - run: uv build
      - run: uv run python -c "import shutil,glob; shutil.copy(glob.glob('dist/pharmadata-*.whl')[0], 'docs/notebooks/pharmadata-0.0.0-py3-none-any.whl')"

      - name: Build site
        run: uv run great-docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
