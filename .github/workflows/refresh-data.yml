name: Refresh data

on:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Rebuild from upstream and open a PR
    runs-on: ubuntu-latest
    env:
      # R loads R_LIBS_USER whatever the working directory, so the locked library
      # reaches Quarto, which starts its R from a copy under tmp/.
      R_LIBS_USER: ${{ runner.temp }}/rlib
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - name: Install the Python toolchain
        run: uv sync --all-groups

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Keyed on the lockfile: a hit is the same library, a miss is a restore.
      - name: Cache the locked R library
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: r-${{ runner.os }}-

      # One lockfile serves both R stages: the export programs and the Quarto render.
      # renv reads it, so it is installed as a tool rather than restored from it.
      - name: Restore the locked R packages
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e 'install.packages("renv", repos = "https://cloud.r-project.org")'
          Rscript -e 'renv::restore(lockfile = "renv.lock", library = Sys.getenv("R_LIBS_USER"), prompt = FALSE)'

      # The workflow's only network step: download each source's files, at the ref
      # recorded in data-raw/01_fetch_sources.py, into data-raw/sources/.
      - name: Fetch the upstream sources
        run: uv run python data-raw/01_fetch_sources.py

      - name: Export parquet + metadata from every source
        run: Rscript data-raw/02_export_data.R

      - name: Validate the regenerated raw inputs
        run: uv run python data-raw/03_build_data.py --check

      - name: Package data and regenerate stubs and docs
        run: uv run python data-raw/03_build_data.py

      - name: Test
        run: uv run pytest

      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(data): refresh datasets from upstream"
          branch: refresh/upstream-data
          title: "Refresh datasets from upstream"
          body: |
            Regenerated by the refresh workflow from the latest `pharmaverseadam`,
            `pharmaversesdtm` and the CDISC pilot archives in `phuse-org/phuse-scripts`.
            Review the dataset changes in `src/pharmadata/_data/**/_meta.json` before
            merging.
          delete-branch: true
