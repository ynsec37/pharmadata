name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, typos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run typos

  type:
    name: Type check (mypy + pyrefly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-groups
      - run: uv run mypy
      - run: uv run pyrefly check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-groups
      # build/docs tests need the data pipeline (fetch + R export); they are
      # exercised by the docs job. The sdist subset skips them.
      - run: uv run pytest -m "not build and not docs" --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  docs:
    name: Build docs (great-docs)
    runs-on: ubuntu-latest
    env:
      # The locked R library must be on R's default search path: great-docs runs
      # Quarto, which starts its R in a scratch dir with no project .Rprofile.
      R_LIBS_USER: /tmp/rlib
      # Tell renv (and setup-renv) to install into that same path.
      RENV_PATHS_LIBRARY: /tmp/rlib
      # knitr (engine: knitr) runs {python} chunks via reticulate; the jupyter
      # engine uses QUARTO_PYTHON.  Point both at the venv interpreter that has
      # polars and pharmadata installed (uv sync --group docs creates .venv).
      RETICULATE_PYTHON: ${{ github.workspace }}/.venv/bin/python
      QUARTO_PYTHON: ${{ github.workspace }}/.venv/bin/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --group docs
      # Posit's official R setup, then renv restores the packages the
      # comparative Resources pages need (knitr, reticulate, dplyr, ...).
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      # The export scripts and their testthat suite run against the locked library.
      - name: R export-stage tests
        run: Rscript data-raw/tests/testthat.R
      # great-docs needs Quarto to render .qmd pages; official Posit action.
      - uses: quarto-dev/quarto-actions/setup@v2
      # Build the raw inputs the shipped data is regenerated from. Without
      # these, 03_build_data.py's validate() refuses to run.
      - name: Fetch upstream sources
        run: uv run python data-raw/01_fetch_sources.py
      - name: Export raw datasets
        run: Rscript data-raw/02_export_data.R
      # Regenerate everything 03_build_data owns and require a clean diff: anything that
      # drifted from its source fails here instead of shipping stale.
      - name: Generated data + docs match their sources
        run: |
          uv run python data-raw/03_build_data.py
          uv run python data-raw/05_build_dataset_qmd.py
          git diff --exit-code -- docs/datasets src/pharmadata
      # The WASM notebook installs the package from a wheel served alongside the
      # page. The wheel is gitignored, so build it here before great-docs copies
      # docs/notebooks/ into the site.
      - run: uv build
      - run: uv run python -c "import shutil,glob; shutil.copy(glob.glob('dist/pharmadata-*.whl')[0], 'docs/notebooks/pharmadata-0.0.0-py3-none-any.whl')"
      # Build the site; great-docs reads great-docs.yml, _freeze and assets from the project root.
      - run: uv run great-docs build

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
