name: Bug report
description: Report something that does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to file a bug report. Please fill in the fields
        below so the problem can be reproduced.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short code block that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, and pharmadata version (`pip show pharmadata`).
      value: |
        OS:
        Python:
        pharmadata:
    validations:
      required: true
